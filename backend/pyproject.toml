[project]
name = "atlante-celeste-backend"
version = "1.0.0"
license = "GPL-3.0-or-later"
description = "Motore dati di Atlante Celeste: scarica, normalizza, mette in cache e serve effemeridi e cataloghi astronomici"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    # per preparare i tasselli quando si scaricano le stelle di Gaia dal programma
    "numpy>=2.0",
]

[dependency-groups]
desktop = [
    "pywebview>=6.2",
]
dev = [
    "pytest>=8",
    "numpy>=2.0",
    "pillow>=13.0.0",
    "scipy>=1.18.1",
]

[tool.uv]
package = false
# l'app installa solo ciò che serve per girare; gli strumenti (test, script delle immagini)
# si aggiungono con --group dev
default-groups = []

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
